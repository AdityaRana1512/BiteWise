services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: bitewise
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: bitewise_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitewise -d bitewise_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://bitewise:dev_password@postgres:5432/bitewise_db
      GROQ_API_KEY: ${GROQ_API_KEY}
      
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/storage:/app/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  

volumes:
  postgres_data: